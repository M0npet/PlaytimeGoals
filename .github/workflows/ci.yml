name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  timer-probe:
    name: Long completion timer probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.400

      - name: Run long completion timer regression probe
        run: dotnet run --project tests/TimerDelayProbe/TimerDelayProbe.csproj -c Release
